name: Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch (e.g., twrp-12.1, twrp-11, twrp-9.0, twrp-14.1)'
        required: true
        default: 'twrp-12.1'
        type: string
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/TeamWin/android_device_xiaomi_polaris'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/polaris'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'polaris'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP
    timeout-minutes: 360
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_BROKEN_LINK_TYPE: true
      BUILD_BROKEN_DUP_RULES: true
      BUILD_BROKEN_MISSING_REQUIRED_MODULES: true
      BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES: true
      BUILD_BROKEN_USES_BUILD_COPY_HEADERS: true
      BUILD_BROKEN_VINTF_PRODUCT_COPY_FILES: true
      BUILD_BROKEN_PREBUILT_ELF_FILES: true
      BUILD_BROKEN_VERIFY_USES_LIBRARIES: true
      RELAX_USES_LIBRARY_CHECK: true
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@main
      
    - name: Display Inputs
      run: |
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
          gperf gcc-multilib g++-multilib bc ccache liblz4-tool libncurses-dev \
          libsdl1.2-dev lzop pngcrush schedtool squashfs-tools imagemagick \
          libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libgflags-dev \
          clang-14 lld-14 llvm-14

    - name: Setup LLVM/Clang
      run: |
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
        sudo update-alternatives --install /usr/bin/ld ld /usr/bin/lld-14 100
        export PATH=/usr/lib/llvm-14/bin:$PATH
        echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> $GITHUB_ENV
        clang --version

    - name: Install Temurin
      uses: actions/setup-java@main
      with:
        distribution: temurin
        java-version: 17

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@master
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        
        echo "Cloning device tree (using default branch)..."
        git clone --depth=1 "${{ github.event.inputs.DEVICE_TREE }}" "./$DEVICE_PATH"
        cd $DEVICE_PATH
        
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "Device tree cloned successfully"

    - name: Fix empty dependencies file
      run: |
        cd workspace
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        
        echo "Checking for empty dependencies files in $DEVICE_PATH"
        
        find $DEVICE_PATH -name "*.dependencies" -type f 2>/dev/null | while read file; do
          if [ ! -s "$file" ]; then
            echo "File $file is empty, creating valid JSON"
            echo '[]' > "$file"
          fi
        done
        
        if [ -z "$(find $DEVICE_PATH -name "*.dependencies" -type f 2>/dev/null)" ]; then
          echo "No dependencies file found, creating omni.dependencies"
          echo '[]' > $DEVICE_PATH/omni.dependencies
        fi

    - name: Create embedded.mk
      run: |
        cd workspace
        if [ ! -f build/target/product/embedded.mk ]; then
          mkdir -p build/target/product
          cat > build/target/product/embedded.mk << 'EOF'
        PRODUCT_PACKAGES += \
            debuggerd \
            init \
            sh \
            shell \
            toolbox \
            fsck.f2fs \
            mkfs.f2fs \
            e2fsck \
            mke2fs \
            tune2fs \
            adb \
            fastboot \
            recovery \
            twrp \
            mount \
            umount \
            dd \
            blkid \
            fdisk \
            parted
        EOF
        fi
        
        if [ ! -f build/make/target/product/embedded.mk ] && [ -f build/target/product/embedded.mk ]; then
          mkdir -p build/make/target/product
          ln -sf ../../../build/target/product/embedded.mk build/make/target/product/embedded.mk
        fi

    - name: Check Build Makefile
      run: |
        cd workspace
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"
        
        if [ -f $DEVICE_PATH/twrp_$DEVICE_NAME.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_$DEVICE_NAME" >> $GITHUB_ENV
        elif [ -f $DEVICE_PATH/omni_$DEVICE_NAME.mk ]; then
            echo "DEVICE_MAKEFILE=omni_$DEVICE_NAME" >> $GITHUB_ENV
        elif [ -f $DEVICE_PATH/device_$DEVICE_NAME.mk ]; then
            echo "DEVICE_MAKEFILE=device_$DEVICE_NAME" >> $GITHUB_ENV
        else
            echo "No recovery makefile found"
            exit 1
        fi
      
    - name: Install Python 3
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14.1'
      run: |
        sudo apt -y install python3
        cd /usr/bin
        sudo ln -sf python3 python

    - name: Clean Obsolete Compiler Flags
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk ]; then
          echo "Cleaning obsolete compiler flags from BoardConfig.mk..."
          sed -i '/USE_CLANG_PLATFORM_BUILD/d' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
          sed -i '/TARGET_USE_CLANG/d' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
          sed -i '/TARGET_USE_GCC/d' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
          sed -i '/TARGET_USE_CLANG_LLD/d' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
          echo "BoardConfig.mk cleaned"
        fi

    - name: Build Image 
      id: build
      run: |
        cd workspace
        export PATH=/usr/lib/llvm-14/bin:$PATH
        export CC=clang
        export CXX=clang++
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export STRIP=llvm-strip
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export READELF=llvm-readelf
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export TARGET_USES_MKE2FS=true
        export SKIP_ABI_CHECKS=true
        export WITH_TWRP_SWIPE=true
        export BUILD_NUMBER=$(date +%s)
        export PLATFORM_VERSION=12
        export PLATFORM_VERSION_CODENAME=REL
        
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        make clobber
        make clean
        
        # Build và lưu log lỗi
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        
        # Chỉ hiển thị 100 dòng cuối của log lỗi
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "::group::Build failed - Last 100 lines of error log"
          tail -n 100 build.log
          echo "::endgroup::"
          echo "BUILD_FAILED=true" >> $GITHUB_ENV
        else
          echo "BUILD_FAILED=false" >> $GITHUB_ENV
        fi
        
        # Lưu log file để upload
        cp build.log ${{ github.workspace }}/build.log
        exit $BUILD_EXIT_CODE
      continue-on-error: true

    - name: Upload build log if failed
      if: env.BUILD_FAILED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: build.log
        retention-days: 7

    - name: Check build result
      if: env.BUILD_FAILED == 'true'
      run: |
        echo "Build failed. Check the uploaded artifact for full log."
        exit 1
      
    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check Recovery Image
      run: |
        cd workspace
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"
        BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}"
        
        if [ -f out/target/product/$DEVICE_NAME/recovery.img ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/$DEVICE_NAME/recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f out/target/product/$DEVICE_NAME/boot.img ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/$DEVICE_NAME/boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f out/target/product/$DEVICE_NAME/vendor_boot.img ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/$DEVICE_NAME/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "No recovery image found"
            exit 1
        fi

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Recovery to tar
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
        name: TWRP for ${{ github.event.inputs.DEVICE_NAME }} - ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Build Date: ${{ env.BUILD_DATE }}
          Commit: ${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}
          MD5: ${{ env.MD5_IMG }}
          Compiler: LLVM/Clang 14

    - name: Release Ramdisk
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ramdisk-recovery.*
        name: TWRP Ramdisk for ${{ github.event.inputs.DEVICE_NAME }} - ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Build Date: ${{ env.BUILD_DATE }}
          Commit: ${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}
          MD5: ${{ env.MD5_IMG }}
          Compiler: LLVM/Clang 14