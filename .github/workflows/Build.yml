name: Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch (automatic = auto-detect default branch)'
        required: true
        default: 'automatic'
        type: string
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/TeamWin/android_device_xiaomi_polaris'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/polaris'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'polaris'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
      KERNEL_SOURCE:
        description: 'Kernel Source (optional)'
        required: false
        default: 'https://github.com/LineageOS/android_kernel_xiaomi_sdm845'
        type: string
      KERNEL_BRANCH:
        description: 'Kernel Source Branch (optional)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build TWRP
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@main
      
    - name: Set Build Environment Variables
      run: |
        echo "KERNEL_BUILD_RESULT=prebuilt" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL%.git}" >> $GITHUB_ENV

    - name: System Cleanup & Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
        sudo apt update && sudo apt -y upgrade
        sudo apt -y install git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 x11proto-core-dev libx11-dev lib32z-1g-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3 python3-pip gperf gcc-multilib \
          g++-multilib bc ccache liblz4-tool libncurses-dev libsdl1.2-dev lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev libgflags-dev clang-14 lld-14 llvm-14 libtinfo5 libncurses5

    - name: Setup Toolchain & Git-Repo
      run: |
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
        sudo update-alternatives --install /usr/bin/ld ld /usr/bin/lld-14 100
        echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> $GITHUB_ENV
        
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Setup Java & Swap
      run: |
        java -version
      uses: actions/setup-java@main
        distribution: temurin
        java-version: 17
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Initialize & Sync Manifest
      run: |
        BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        AOSP_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
        OMNI_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
        LOS_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_lineageos.git"

        MANIFEST_URL="$OMNI_URL"
        MANIFEST_BRANCH_ARG=""

        if [[ "$BRANCH" == "twrp-11" || "$BRANCH" == "twrp-12.1" ]]; then
          MANIFEST_URL="$AOSP_URL"
          MANIFEST_BRANCH_ARG="$BRANCH"
        elif [[ "$BRANCH" == "twrp-14.1" ]]; then
          MANIFEST_URL="$LOS_URL"
          MANIFEST_BRANCH_ARG="$BRANCH"
        elif [[ "$BRANCH" =~ ^twrp-[0-9] ]]; then
          MANIFEST_BRANCH_ARG="$BRANCH"
        elif [[ "$BRANCH" =~ ^lineage-([0-9]+) ]]; then
          case "${BASH_REMATCH[1]}" in
            14) MANIFEST_URL="$LOS_URL"; MANIFEST_BRANCH_ARG="twrp-14.1" ;;
            18) MANIFEST_URL="$AOSP_URL"; MANIFEST_BRANCH_ARG="twrp-11" ;;
            19) MANIFEST_URL="$AOSP_URL"; MANIFEST_BRANCH_ARG="twrp-12.1" ;;
            *) MANIFEST_URL="$OMNI_URL"; MANIFEST_BRANCH_ARG="twrp-9.0" ;;
          esac
        elif [[ "$BRANCH" != "automatic" ]]; then
          MANIFEST_BRANCH_ARG="$BRANCH"
        fi

        echo "MANIFEST_URL=$MANIFEST_URL" >> $GITHUB_ENV
        echo "MANIFEST_BRANCH_ARG=$MANIFEST_BRANCH_ARG" >> $GITHUB_ENV

        mkdir -p workspace && cd workspace
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        if [ -z "$MANIFEST_BRANCH_ARG" ]; then
          repo init --depth=1 -u "$MANIFEST_URL"
        else
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH_ARG"
        fi
        
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone --depth=1 "${{ github.event.inputs.DEVICE_TREE }}" "./${{ github.event.inputs.DEVICE_PATH }}"
        echo "COMMIT_ID=$(git -C ${{ github.event.inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

    - name: Clone & Build Kernel (Optional)
      if: github.event.inputs.KERNEL_SOURCE != ''
      continue-on-error: true
      run: |
        cd workspace
        KERNEL_BRANCH="${{ github.event.inputs.KERNEL_BRANCH }}"
        
        if [ -z "$KERNEL_BRANCH" ] && [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" =~ ^lineage- ]]; then
          KERNEL_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        fi
        
        if [ -z "$KERNEL_BRANCH" ]; then
          git clone --depth=1 "${{ github.event.inputs.KERNEL_SOURCE }}" "kernel_src"
        else
          git clone --depth=1 -b "$KERNEL_BRANCH" "${{ github.event.inputs.KERNEL_SOURCE }}" "kernel_src" 2>/dev/null || \
          git clone --depth=1 "${{ github.event.inputs.KERNEL_SOURCE }}" "kernel_src"
        fi
        
        [ ! -d kernel_src ] && exit 0
        
        BOARD_CONFIG="${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
        KERNEL_ARCH=$(grep -oP '(?<=^TARGET_ARCH := ).*' "$BOARD_CONFIG" 2>/dev/null || echo "arm64")
        CONFIG_DIR="kernel_src/arch/$KERNEL_ARCH/configs"
        
        [ ! -d "$CONFIG_DIR" ] && exit 0
        
        DEFCONFIG=$(find "$CONFIG_DIR" -maxdepth 1 -iname "*${{ github.event.inputs.DEVICE_NAME }}*defconfig*" -o -iname "*defconfig*" | head -n1)
        [ -z "$DEFCONFIG" ] && exit 0
        
        sudo apt -y install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bc
        
        cd kernel_src
        export ARCH=$KERNEL_ARCH CROSS_COMPILE=aarch64-linux-gnu- CC=clang PATH=/usr/lib/llvm-14/bin:$PATH
        
        make O=out $(basename "$DEFCONFIG") 2>/dev/null
        make O=out -j$(nproc --all) 2>&1 | tail -20
        
        for img in out/arch/$KERNEL_ARCH/boot/Image.gz-dtb out/arch/$KERNEL_ARCH/boot/Image.gz out/arch/$KERNEL_ARCH/boot/Image; do
          [ -f "$img" ] && { cp "$img" "../${{ github.event.inputs.DEVICE_PATH }}/Image.gz-dtb"; echo "KERNEL_BUILD_RESULT=source" >> $GITHUB_ENV; break; }
        done

    - name: Prepare Build
      run: |
        cd workspace
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"
        
        # Fix empty dependencies & create default if missing
        find "$DEVICE_PATH" -name "*.dependencies" -size 0 -exec echo '[]' \; > {} \;
        [ ! -f "$DEVICE_PATH/omni.dependencies" ] && echo '[]' > "$DEVICE_PATH/omni.dependencies"
        
        # Ensure embedded.mk exists
        mkdir -p build/target/product
        cat > build/target/product/embedded.mk << 'EOF'
        PRODUCT_PACKAGES += debuggerd init sh shell toolbox fsck.f2fs mkfs.f2fs \
            e2fsck mke2fs tune2fs adb fastboot recovery twrp mount umount dd blkid fdisk parted
        EOF
        
        # Find device makefile
        for mk in twrp_${DEVICE_NAME} omni_${DEVICE_NAME} device_${DEVICE_NAME}; do
          [ -f "$DEVICE_PATH/${mk}.mk" ] && { echo "DEVICE_MAKEFILE=$mk" >> $GITHUB_ENV; break; }
        done || { echo "::error::No makefile found"; exit 1; }
        
        # Clean obsolete flags
        [ -f "$DEVICE_PATH/BoardConfig.mk" ] && sed -i '/USE_CLANG_PLATFORM_BUILD\|TARGET_USE_CLANG\|TARGET_USE_GCC\|TARGET_USE_CLANG_LLD/d' "$DEVICE_PATH/BoardConfig.mk"
        
        # Apply patches
        [ -f ../common_patch.txt ] && { echo -e "\n# Common patches" >> "$DEVICE_PATH/BoardConfig.mk"; cat ../common_patch.txt >> "$DEVICE_PATH/BoardConfig.mk"; }
        [ -f ../patch.txt ] && {
          PATCH=$(awk -v dev="$DEVICE_NAME" '/^# Device:/ {found=($3==dev); next} found && NF {print}' ../patch.txt)
          [ -n "$PATCH" ] && { echo -e "\n# Device patch" >> "$DEVICE_PATH/BoardConfig.mk"; echo "$PATCH" >> "$DEVICE_PATH/BoardConfig.mk"; }
        }
        
        # Fix version defaults
        [ -f build/make/core/version_defaults.mk ] && ! grep -q "PLATFORM_VERSION_ALL_CODENAMES" build/make/core/version_defaults.mk && \
          sed -i '/PLATFORM_VERSION_CODENAME/a PLATFORM_VERSION_ALL_CODENAMES := REL' build/make/core/version_defaults.mk
        
        # Install Python 2 for older builds
        [[ ! "${{ env.MANIFEST_BRANCH_ARG }}" =~ twrp-(11|12\.1|14\.1) ]] && { sudo apt -y install python2 2>/dev/null || true; [ ! -L /usr/bin/python ] && sudo ln -sf /usr/bin/python2 /usr/bin/python; }

    - name: Build Recovery Image
      run: |
        cd workspace
        export PATH=/usr/lib/llvm-14/bin:$PATH
        export CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true TARGET_USES_MKE2FS=true SKIP_ABI_CHECKS=true WITH_TWRP_SWIPE=true BUILD_NUMBER=$(date +%s)
        
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        make clobber
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Prepare Release Assets
      run: |
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"
        OUT="workspace/out/target/product/$DEVICE_NAME"
        
        # Detect image type
        for img in recovery.img boot.img vendor_boot.img; do
          [ -f "$OUT/$img" ] && { echo "RECOVERY_TYPE=${img%.img}" >> $GITHUB_ENV; break; }
        done || { echo "::error::No recovery image"; exit 1; }
        
        echo "MD5_IMG=$(md5sum $OUT/${{ env.RECOVERY_TYPE }}.img | cut -d' ' -f1)" >> $GITHUB_ENV
        
        # Optional: Add installer
        [ "${{ github.event.inputs.RECOVERY_INSTALLER }}" = "true" ] && {
          cd "$OUT"
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip 2>/dev/null || true
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img 2>/dev/null || true
        }
        
        # Optional: Create tar
        [ "${{ github.event.inputs.RECOVERY_TAR }}" = "true" ] && {
          cd "$OUT"
          tar -cf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img 2>/dev/null || true
        }

    - name: Upload Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
        name: TWRP for ${{ github.event.inputs.DEVICE_NAME }} - ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          **Build Info**
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Date: ${{ env.BUILD_DATE }}
          Commit: ${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}
          MD5: ${{ env.MD5_IMG }}
          Compiler: LLVM/Clang 14
          Kernel: ${{ env.KERNEL_BUILD_RESULT }}
      continue-on-error: true
